<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cây Gia Phả Gia Đình Việt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <!-- Floating Self Box -->
    <div id="floatingBox" class="floating-box" draggable="true">
      <div class="floating-box-header">+</div>
      <div class="floating-box-content">Bản thân</div>
    </div>

    <div class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div style="background: #f0f0f0; padding: 10px; border-radius: 5px; margin-bottom: 10px; font-size: 12px;">
          <strong>Debug Info:</strong>
          <div id="debugInfo">Loading...</div>
        </div>

        <div id="selfInfoSection" class="self-info-section"></div>

        <div id="addMemberSection" class="add-member-section" style="display: none;">
          <form id="addMemberForm">
            <div class="form-group">
              <label for="memberName">Tên</label>
              <input type="text" id="memberName" placeholder="Họ tên" required>
            </div>
            <div class="form-group">
              <label for="birthYear">Năm sinh</label>
              <input type="number" id="birthYear" placeholder="1980" min="1900">
            </div>
            <div class="form-group">
              <label for="gender">Giới tính</label>
              <select id="gender">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
              </select>
            </div>
            <div class="form-group">
              <label for="parentSelect">Cha/Mẹ (nếu có)</label>
              <select id="parentSelect">
                <option value="">-- Không có --</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">Thêm</button>
          </form>
        </div>

        <div class="members-list-section">
          <div id="membersList" class="members-list"></div>
        </div>
      </aside>

      <!-- Main Tree View -->
      <main class="tree-view">
        <div id="treeContainer" class="tree-container"></div>
        <p class="empty-state" id="emptyState">Chưa có thành viên. Hãy thêm thành viên đầu tiên!</p>
      </main>
    </div>
  </div>

  <!-- Modal Xem Chi Tiết -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
