<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cây Gia Phả Gia Đình Việt</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <header>
      <h1>🌳 Cây Gia Phả Gia Đình</h1>
      <p class="subtitle">Lưu giữ và chia sẻ lịch sử gia đình Việt Nam</p>
    </header>

    <div class="main-content">
      <!-- Sidebar -->
      <aside class="sidebar">
        <div class="add-member-section">
          <h2>Thêm Thành Viên</h2>
          <form id="addMemberForm">
            <div class="form-group">
              <label for="memberName">Tên</label>
              <input type="text" id="memberName" placeholder="Họ tên" required>
            </div>
            <div class="form-group">
              <label for="birthYear">Năm sinh</label>
              <input type="number" id="birthYear" placeholder="1980" min="1900">
            </div>
            <div class="form-group">
              <label for="gender">Giới tính</label>
              <select id="gender">
                <option value="Nam">Nam</option>
                <option value="Nữ">Nữ</option>
              </select>
            </div>
            <div class="form-group">
              <label for="parentSelect">Cha/Mẹ (nếu có)</label>
              <select id="parentSelect">
                <option value="">-- Không có --</option>
              </select>
            </div>
            <button type="submit" class="btn-primary">Thêm Thành Viên</button>
          </form>
        </div>

        <div class="members-list-section">
          <h2>Danh Sách Thành Viên</h2>
          <div id="membersList" class="members-list"></div>
        </div>
      </aside>

      <!-- Main Tree View -->
      <main class="tree-view">
        <div id="treeContainer" class="tree-container"></div>
        <p class="empty-state" id="emptyState">Chưa có thành viên. Hãy thêm thành viên đầu tiên!</p>
      </main>
    </div>
  </div>

  <!-- Modal Xem Chi Tiết -->
  <div id="modal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>

        <label for="modalName">Tên sự kiện</label>
        <input type="text" id="modalName" required>
        
        <label for="modalStartTime">Thời gian bắt đầu</label>
        <input type="datetime-local" id="modalStartTime" required>
        
        <label for="modalEndTime">Thời gian kết thúc</label>
        <input type="datetime-local" id="modalEndTime" required>
        
        <label for="modalColor">Màu sắc</label>
        <div class="color-picker-group">
          <input type="color" id="modalColor" title="Chọn màu">
          <input type="text" id="modalColorCode" placeholder="#RRGGBB" maxlength="7">
        </div>
      </form>
    </div>

    <!-- Close button at bottom -->
    <div class="button-group">
      <button class="close-btn" onclick="closeEventModal()">Đóng</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
